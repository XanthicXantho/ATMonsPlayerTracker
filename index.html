<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xantho</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f1a;
    --panel: #131626;
    --border: #2a2f50;
    --accent: #7c3aed;
    --accent2: #06b6d4;
    --star: #f59e0b;
    --pending: #94a3b8;
    --denied: #ef4444;
    --accepted: #22c55e;
    --text: #e2e8f0;
    --muted: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'VT323', monospace;
    font-size: 20px;
    min-height: 100vh;
    overflow-x: hidden;
    background:
      radial-gradient(ellipse 90% 55% at 50% 110%, rgba(124,58,237,0.28) 0%, rgba(99,40,200,0.12) 35%, transparent 65%),
      radial-gradient(ellipse 60% 35% at 50% 100%, rgba(245,158,11,0.13) 0%, transparent 55%),
      linear-gradient(to top, #111228 0%, #0d0f1e 50%, #080a14 100%);
  }

  #glitter-canvas, #fog-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }

  nav, .hero, .hub, .updates, .footer-section {
    position: relative; z-index: 1;
  }

  /* ── NAV ─────────────────────────────────────────────── */
  nav {
    position: sticky; top: 0; z-index: 10;
    display: flex; justify-content: center; gap: 0;
    padding: 12px 20px;
    background: rgba(13,15,26,0.80);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    flex-wrap: wrap;
  }
  nav a {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px; color: var(--muted);
    text-decoration: none; letter-spacing: 2px;
    padding: 6px 14px; border-radius: 4px;
    border: 1px solid transparent;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  nav a + a {
    border-left: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    margin-left: 4px;
    padding-left: 18px;
  }
  nav a .ext-icon {
    width: 13px; height: 13px;
    fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    opacity: 0.5;
    flex-shrink: 0;
  }
  nav a:hover {
    color: var(--accent2);
    border-color: rgba(6,182,212,0.3);
    background: rgba(6,182,212,0.06);
    text-shadow: 0 0 10px rgba(6,182,212,0.4);
  }
  nav a.active {
    color: var(--star);
    border-color: rgba(245,158,11,0.3);
    background: rgba(245,158,11,0.06);
    text-shadow: 0 0 10px rgba(245,158,11,0.4);
  }

  /* ── HERO ────────────────────────────────────────────── */
  .hero {
    text-align: center;
    padding: 72px 20px 56px;
  }
  .hero-card {
    display: inline-block;
    background: rgba(0,0,0,0.18);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px;
    padding: 44px 52px;
    max-width: 640px;
    animation: heroFade 0.8s ease both;
  }
  @keyframes heroFade {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hero-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 28px; color: var(--star);
    text-shadow: 0 0 24px rgba(245,158,11,0.5), 0 0 60px rgba(245,158,11,0.15);
    letter-spacing: 4px;
    line-height: 1.6;
  }
  .hero-hosted {
    margin-top: 16px;
    color: var(--accent2); font-size: 20px;
    letter-spacing: 4px;
    text-shadow: 0 0 14px rgba(6,182,212,0.5);
    font-family: 'VT323', monospace;
  }
  .hero-tagline {
    margin-top: 20px;
    color: var(--muted); font-size: 22px;
    letter-spacing: 1px;
    line-height: 1.5;
    max-width: 480px;
    margin-left: auto; margin-right: auto;
  }

  /* ── HUB CARDS ───────────────────────────────────────── */
  .hub {
    max-width: 820px;
    margin: 0 auto;
    padding: 0 20px 64px;
  }
  .section-label {
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px; color: var(--accent);
    letter-spacing: 4px;
    text-shadow: 0 0 12px rgba(124,58,237,0.5);
    margin-bottom: 24px;
  }
  .hub-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 16px;
  }
  .hub-card {
    display: flex; flex-direction: column;
    align-items: center; text-align: center;
    padding: 30px 18px;
    background: rgba(0,0,0,0.40);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    text-decoration: none; color: var(--text);
    transition: border-color 0.25s, background 0.25s, transform 0.2s;
    animation: cardFade 0.5s ease both;
  }
  .hub-grid > :nth-child(1) { animation-delay: 0.1s; }
  .hub-grid > :nth-child(2) { animation-delay: 0.2s; }
  .hub-grid > :nth-child(3) { animation-delay: 0.3s; }
  @keyframes cardFade {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hub-card:hover {
    border-color: var(--accent);
    background: rgba(124,58,237,0.10);
    transform: translateY(-4px);
  }
  .hub-icon {
    font-size: 28px; margin-bottom: 14px;
    color: var(--star);
    text-shadow: 0 0 16px rgba(245,158,11,0.5);
  }
  .hub-card-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px; letter-spacing: 2px;
    color: var(--accent2);
    text-shadow: 0 0 8px rgba(6,182,212,0.4);
    margin-bottom: 8px;
  }
  .hub-card-desc {
    font-size: 18px; color: var(--muted);
    letter-spacing: 1px;
  }

  /* ── YOUTUBE CARD WITH PLAYLIST DROPDOWN ───────────────── */
  .hub-card-yt {
    position: relative;
    padding: 0;
    overflow: visible;
    align-items: stretch;
  }
  .hub-card-yt-wrap {
    display: flex;
    width: 100%;
    border-radius: 13px;
    overflow: hidden;
  }
  .hub-card-yt .hub-card-main {
    display: flex; flex-direction: column;
    align-items: center; text-align: center;
    padding: 30px 18px 30px 54px;
    text-decoration: none; color: var(--text);
    flex: 1; min-width: 0;
  }
  .yt-toggle {
    display: flex; align-items: center; justify-content: center;
    width: 36px; flex-shrink: 0;
    background: none; border: none;
    border-left: 1px solid rgba(255,255,255,0.08);
    color: var(--muted);
    cursor: pointer; padding: 0;
    transition: color 0.2s, background 0.2s;
  }
  .yt-toggle:hover {
    color: var(--accent2);
    background: rgba(255,255,255,0.04);
  }
  .yt-toggle .yt-chevron {
    display: inline-block;
    transition: transform 0.3s;
    line-height: 0;
  }
  .yt-toggle .yt-chevron svg {
    width: 14px; height: 14px;
    fill: currentColor;
  }
  .yt-toggle.open .yt-chevron { transform: rotate(180deg); }
  .yt-playlists {
    position: absolute;
    top: 100%; left: -1px; right: -1px;
    z-index: 10;
    background: rgba(10, 6, 24, 0.95);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: none;
    border-radius: 0 0 14px 14px;
    max-height: 0; overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .yt-playlists.open {
    max-height: 300px;
    border: 1px solid rgba(255,255,255,0.08);
    border-top: none;
  }
  .hub-card-yt.dropdown-open {
    border-radius: 14px 14px 0 0;
    border-bottom-color: rgba(255,255,255,0.08);
  }
  .hub-card-yt.dropdown-open .hub-card-yt-wrap {
    border-radius: 13px 13px 0 0;
  }
  .yt-playlists-inner {
    padding: 14px 16px;
    font-size: 16px; color: var(--muted);
    text-align: center; letter-spacing: 1px;
  }
  .yt-playlists-inner .yt-empty {
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: var(--muted);
    opacity: 0.5;
    padding: 8px 0;
    letter-spacing: 2px;
  }
  .yt-playlists-inner a {
    display: block; padding: 6px 0;
    color: var(--accent2); text-decoration: none;
    font-family: 'VT323', monospace; font-size: 18px;
    transition: color 0.15s;
  }
  .yt-playlists-inner a:hover { color: var(--star); }

  /* ── UPDATES / NEWS ──────────────────────────────────── */
  .updates {
    max-width: 700px;
    margin: 0 auto;
    padding: 0 20px 64px;
  }
  .updates-card {
    background: rgba(0,0,0,0.22);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 28px 32px;
  }
  .updates-placeholder {
    color: var(--muted); font-size: 20px;
    letter-spacing: 2px; text-align: center;
  }

  /* ── FOOTER ──────────────────────────────────────────── */
  .footer-section {
    text-align: center;
    padding: 12px 20px 40px;
  }
  .footer-link {
    color: var(--muted); font-size: 16px; letter-spacing: 2px;
    margin-bottom: 12px;
  }
  .footer-link a { color: var(--accent2); text-decoration: none; }
  .footer-link a:hover { text-decoration: underline; }
  .footer-text {
    color: var(--muted); font-size: 14px; letter-spacing: 2px;
  }

  /* ── RESPONSIVE ──────────────────────────────────────── */
  @media (max-width: 600px) {
    .hero { padding: 56px 16px 40px; }
    .hero-card { padding: 30px 24px; }
    .hero-title { font-size: 18px; letter-spacing: 2px; }
    .hero-tagline { font-size: 20px; }
    .hub-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .hub-card { padding: 22px 14px; }
    nav a { font-size: 7px; padding: 5px 10px; letter-spacing: 1px; }
  }
  @media (max-width: 380px) {
    .hub-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

<script>
  /* ── GLITTER STARS ─────────────────────────────────── */
  const canvas = document.getElementById('glitter-canvas');
  const ctx = canvas.getContext('2d');
  const COLORS = ['#f59e0b','#fcd34d','#f97316','#fbbf24','#fde68a'];
  let flakes = [];

  function resizeCanvas() {
    const oldW = canvas.width || window.innerWidth;
    const oldH = canvas.height || window.innerHeight;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const rx = canvas.width / oldW, ry = canvas.height / oldH;
    for (const f of flakes) { f.x *= rx; f.y *= ry; }
  }
  function spawnFlake() {
    return {
      x: Math.random() * canvas.width, y: -20,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      size: Math.random() * 16 + 14, speed: Math.random() * 0.6 + 0.25,
      drift: (Math.random() - 0.5) * 0.4, rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.02, opacity: Math.random() * 0.5 + 0.3,
    };
  }
  function seedFlakes(n) {
    for (let i = 0; i < n; i++) { const f = spawnFlake(); f.y = Math.random() * canvas.height; flakes.push(f); }
  }
  function animateGlitter() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (Math.random() < 0.10) flakes.push(spawnFlake());
    flakes = flakes.filter(f => f.y < canvas.height + 30);
    for (const f of flakes) {
      f.y += f.speed; f.x += f.drift; f.rot += f.rotSpeed;
      ctx.save(); ctx.globalAlpha = f.opacity;
      ctx.font = `${f.size}px serif`;
      ctx.shadowColor = f.color; ctx.shadowBlur = f.size * 1.4;
      ctx.fillStyle = f.color;
      ctx.translate(f.x, f.y); ctx.rotate(f.rot);
      ctx.fillText('✦', -f.size / 2, f.size / 2);
      ctx.restore();
    }
    requestAnimationFrame(animateGlitter);
  }
  resizeCanvas(); seedFlakes(18); animateGlitter();
  window.addEventListener('resize', resizeCanvas);

  /* ── FOG ───────────────────────────────────────────── */
  const fogCanvas = document.getElementById('fog-canvas');
  const fogCtx = fogCanvas.getContext('2d');
  let fogPuffs = [];

  function resizeFog() { fogCanvas.width = window.innerWidth; fogCanvas.height = window.innerHeight; }
  function spawnPuff() {
    const w = fogCanvas.width, h = fogCanvas.height;
    const radius = Math.random() * 220 + 140;
    return {
      x: Math.random() * w * 1.4 - w * 0.2,
      y: h + radius + Math.random() * 40,
      radius: radius,
      speedY: -(Math.random() * 0.22 + 0.08),
      speedX: (Math.random() - 0.5) * 0.10,
      opacity: Math.random() * 0.22 + 0.12,
      hue: Math.random() < 0.6 ? '100,60,220' : '180,100,20',
    };
  }
  function seedFog(n) {
    for (let i = 0; i < n; i++) { const p = spawnPuff(); p.y = fogCanvas.height * (1.0 + Math.random() * 0.5); fogPuffs.push(p); }
  }
  function animateFog() {
    const w = fogCanvas.width, h = fogCanvas.height;
    fogCtx.clearRect(0, 0, w, h);
    if (Math.random() < 0.04) fogPuffs.push(spawnPuff());
    fogPuffs = fogPuffs.filter(p => p.y + p.radius > 0);
    const off = document.createElement('canvas'); off.width = w; off.height = h;
    const offCtx = off.getContext('2d');
    for (const p of fogPuffs) {
      p.y += p.speedY; p.x += p.speedX;
      const heightFade = Math.max(0, Math.min(1, (p.y - h * 0.55) / (h * 0.25)));
      const alpha = p.opacity * heightFade;
      if (alpha <= 0) continue;
      const grad = offCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
      grad.addColorStop(0, `rgba(${p.hue}, ${alpha})`);
      grad.addColorStop(0.5, `rgba(${p.hue}, ${alpha * 0.45})`);
      grad.addColorStop(1, `rgba(${p.hue}, 0)`);
      offCtx.fillStyle = grad; offCtx.beginPath(); offCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); offCtx.fill();
    }
    offCtx.globalCompositeOperation = 'destination-in';
    const mask = offCtx.createLinearGradient(0, h * 0.42, 0, h * 0.72);
    mask.addColorStop(0, 'rgba(0,0,0,0)'); mask.addColorStop(1, 'rgba(0,0,0,1)');
    offCtx.fillStyle = mask; offCtx.fillRect(0, 0, w, h);
    fogCtx.drawImage(off, 0, 0);
    requestAnimationFrame(animateFog);
  }
  resizeFog(); seedFog(14); animateFog();
  window.addEventListener('resize', () => {
    const oldW = fogCanvas.width || window.innerWidth;
    const oldH = fogCanvas.height || window.innerHeight;
    resizeFog();
    const rx = fogCanvas.width / oldW, ry = fogCanvas.height / oldH;
    for (const p of fogPuffs) { p.x *= rx; p.y *= ry; }
  });

  /* ── PLAYLIST DROPDOWN TOGGLE ──────────────────────── */
  function togglePlaylists() {
    var panel = document.getElementById('yt-playlists');
    var card = document.querySelector('.hub-card-yt');
    var opening = !panel.classList.contains('open');
    panel.classList.toggle('open');
    document.querySelector('.yt-toggle').classList.toggle('open');
    if (opening) {
      card.classList.add('dropdown-open');
    } else {
      panel.addEventListener('transitionend', function handler() {
        if (!panel.classList.contains('open')) {
          card.classList.remove('dropdown-open');
        }
        panel.removeEventListener('transitionend', handler);
      });
    }
  }
</script>
