<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xantho</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Determination';
    src: url('determination.woff2') format('woff2');
    font-weight: normal;
    font-style: normal;
  }

  :root {
    --accent: #d4a053;
    --accent-dim: rgba(212,160,83,0.25);
    --accent-glow: rgba(212,160,83,0.4);
    --bg: #000000;
    --bg-deep: #0a0a0f;
    --bg-panel: #111118;
    --border-ut: #ffffff;
    --text: #ffffff;
    --text-dim: #71717a;
    --text-body: #d4d4d8;
    --soul-red: #ff0000;
    --font-ut: 'Determination', monospace;
    --font-clean: 'Outfit', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: linear-gradient(180deg, #0a0c16 0%, #0d0f1a 40%, #111228 100%);
    color: var(--text-body);
    font-family: var(--font-clean);
    font-weight: 400;
    font-size: 16px;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #glitter-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }

  nav, .hero, .hub, .updates, .footer-section {
    position: relative; z-index: 1;
  }

  /* ── Nav ── */
  nav {
    position: sticky; top: 0; z-index: 10;
    display: flex; justify-content: center; gap: 0;
    padding: 0;
    background: var(--bg);
    border-bottom: 2px solid var(--border-ut);
  }
  nav a {
    font-family: var(--font-ut);
    font-size: 14px; color: var(--text-dim);
    text-decoration: none; letter-spacing: 1px;
    padding: 14px 24px;
    transition: color 0.15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  nav a .ext-icon {
    width: 11px; height: 11px;
    fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    opacity: 0.4;
  }
  nav a:hover { color: var(--text); }
  nav a.active { color: var(--accent); }

  /* ── Hero ── */
  .hero {
    text-align: center;
    padding: 96px 20px 24px;
    animation: fade-up 1.2s ease both;
  }
  .hero-channel {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 12px;
  }
  .hero-soul {
    width: 20px;
    height: 20px;
    background: var(--soul-red);
    clip-path: polygon(50% 100%, 0% 35%, 15% 0%, 50% 25%, 85% 0%, 100% 35%);
    animation: soul-beat 2.5s ease-in-out infinite;
    flex-shrink: 0;
  }
  .hero-title {
    font-family: var(--font-ut);
    font-size: 56px;
    color: var(--text);
    letter-spacing: 3px;
    line-height: 1.2;
  }

  /* ── UT separator ── */
  .ut-sep {
    height: 1px;
    max-width: 680px;
    margin: 0 auto 48px;
    background: linear-gradient(90deg, transparent, var(--accent-dim) 20%, var(--accent) 50%, var(--accent-dim) 80%, transparent);
  }

  /* ── Hub ── */
  .hub { max-width: 680px; margin: 0 auto; padding: 0 20px 72px; }
  .hub-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  /* UT battle-box cards */
  .hub-card {
    display: flex; flex-direction: column;
    align-items: center; text-align: center;
    padding: 36px 20px;
    background: var(--bg);
    border: 3px solid var(--border-ut);
    text-decoration: none; color: var(--text);
    transition: border-color 0.2s;
  }
  .hub-card:hover { border-color: var(--accent); }
  .hub-icon {
    width: 40px; height: 40px;
    margin-bottom: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--accent);
  }
  .hub-card-title {
    font-family: var(--font-ut);
    font-size: 18px;
    color: var(--text);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .hub-card-desc {
    font-family: var(--font-clean);
    font-size: 14px; color: var(--text-dim); font-weight: 300;
  }

  /* YouTube card with playlist dropdown */
  .hub-card-yt { position: relative; padding: 0; overflow: visible; align-items: stretch; }
  .hub-card-yt-wrap { display: flex; width: 100%; overflow: hidden; }
  .hub-card-yt .hub-card-main {
    display: flex; flex-direction: column;
    align-items: center; text-align: center;
    padding: 36px 16px 36px 40px;
    text-decoration: none; color: var(--text);
    flex: 1; min-width: 0;
  }
  .yt-toggle {
    display: flex; align-items: center; justify-content: center;
    width: 36px; flex-shrink: 0;
    background: none; border: none;
    border-left: 2px solid var(--border-ut);
    color: var(--text-dim); cursor: pointer; padding: 0;
    transition: color 0.15s;
  }
  .yt-toggle:hover { color: var(--text); }
  .yt-toggle .yt-chevron { display: inline-block; transition: transform 0.25s; line-height: 0; }
  .yt-toggle .yt-chevron svg { width: 14px; height: 14px; fill: currentColor; }
  .yt-toggle.open .yt-chevron { transform: rotate(180deg); }
  .yt-playlists {
    position: absolute; top: 100%; left: -3px; right: -3px; z-index: 10;
    background: var(--bg);
    border: none;
    max-height: 0; overflow: hidden;
    transition: max-height 0.25s ease;
  }
  .yt-playlists.open {
    max-height: 300px;
    border: 3px solid var(--border-ut);
    border-top: none;
  }
  .yt-playlists-inner { padding: 16px; text-align: center; }
  .yt-playlists-inner .yt-empty {
    font-family: var(--font-ut);
    font-size: 14px; color: var(--text-dim);
    padding: 8px 0;
  }

  /* ── Updates ── */
  .updates {
    max-width: 680px; margin: 0 auto; padding: 0 20px 72px;
    animation: fade-up 1.2s ease 0.3s both;
  }
  .section-heading {
    font-family: var(--font-ut);
    font-size: 16px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-bottom: 16px;
  }
  .updates-card {
    background: var(--bg);
    border: 3px solid var(--border-ut);
    padding: 24px 28px;
  }
  .updates-placeholder {
    font-family: var(--font-ut);
    color: var(--text-dim); font-size: 16px;
    text-align: center;
  }

  /* ── Footer ── */
  .footer-section {
    text-align: center;
    padding: 16px 20px 48px;
    color: var(--text-dim); font-size: 13px;
  }

  /* ── Animations ── */
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes soul-beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .hero { padding: 64px 16px 20px; }
    .hero-title { font-size: 36px; }
    .hub-grid { grid-template-columns: 1fr; gap: 10px; }
    .hub-card { padding: 28px 14px; }
    nav a { font-size: 12px; padding: 12px 14px; }
  }
</style>
</head>
<body>

<canvas id="glitter-canvas"></canvas>

<nav>
  <a href="./" class="active">Home</a>
  <a href="https://www.youtube.com/@Xantho6749" target="_blank" rel="noopener">YouTube<svg class="ext-icon" viewBox="0 0 18 18"><path d="M14 4L7 11"/><path d="M14 9V4H9"/><path d="M4 4H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-1"/></svg></a>
  <a href="https://discord.gg/hMpZFfnqh7" target="_blank" rel="noopener">Discord<svg class="ext-icon" viewBox="0 0 18 18"><path d="M14 4L7 11"/><path d="M14 9V4H9"/><path d="M4 4H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-1"/></svg></a>
</nav>

<section class="hero">
  <div class="hero-channel">
    <div class="hero-soul"></div>
    <div class="hero-title">XANTHO</div>
  </div>
</section>

<div class="ut-sep"></div>

<section class="hub">
  <div class="hub-grid">

    <div class="hub-card hub-card-yt">
      <div class="hub-card-yt-wrap">
        <a href="https://www.youtube.com/@Xantho6749" target="_blank" rel="noopener" class="hub-card-main">
          <div class="hub-icon">&#9654;</div>
          <div class="hub-card-title">YouTube</div>
          <div class="hub-card-desc">Watch the series</div>
        </a>
        <button class="yt-toggle" onclick="togglePlaylists()" aria-label="Show playlists">
          <span class="yt-chevron"><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></span>
        </button>
      </div>
      <div class="yt-playlists" id="yt-playlists">
        <div class="yt-playlists-inner">
          <div class="yt-empty">* Nothing here yet.</div>
        </div>
      </div>
    </div>

    <a href="https://discord.gg/hMpZFfnqh7" target="_blank" rel="noopener" class="hub-card">
      <div class="hub-icon">&#9672;</div>
      <div class="hub-card-title">Discord</div>
      <div class="hub-card-desc">Join the community</div>
    </a>

  </div>
</section>

<section class="updates">
  <div class="section-heading">* Updates</div>
  <div class="updates-card">
    <div class="updates-placeholder">* More content coming soon.</div>
  </div>
</section>

<div class="footer-section"></div>

<script>
  const canvas = document.getElementById('glitter-canvas');
  const ctx = canvas.getContext('2d');
  const COLORS = ['#f59e0b','#fcd34d','#fbbf24'];
  let flakes = [];

  function resizeCanvas() {
    const oldW = canvas.width || window.innerWidth;
    const oldH = canvas.height || window.innerHeight;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const rx = canvas.width / oldW, ry = canvas.height / oldH;
    for (const f of flakes) { f.x *= rx; f.y *= ry; }
  }
  function spawnFlake() {
    return {
      x: Math.random() * canvas.width, y: -20,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      size: Math.random() * 10 + 8, speed: Math.random() * 0.3 + 0.15,
      drift: (Math.random() - 0.5) * 0.2, rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.01, opacity: Math.random() * 0.3 + 0.15,
    };
  }
  function seedFlakes(n) {
    for (let i = 0; i < n; i++) { const f = spawnFlake(); f.y = Math.random() * canvas.height; flakes.push(f); }
  }
  function animateGlitter() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (Math.random() < 0.03) flakes.push(spawnFlake());
    flakes = flakes.filter(f => f.y < canvas.height + 30);
    for (const f of flakes) {
      f.y += f.speed; f.x += f.drift; f.rot += f.rotSpeed;
      ctx.save(); ctx.globalAlpha = f.opacity;
      ctx.font = `${f.size}px serif`;
      ctx.fillStyle = f.color;
      ctx.translate(f.x, f.y); ctx.rotate(f.rot);
      ctx.fillText('\u2726', -f.size / 2, f.size / 2);
      ctx.restore();
    }
    requestAnimationFrame(animateGlitter);
  }
  resizeCanvas(); seedFlakes(6); animateGlitter();
  window.addEventListener('resize', resizeCanvas);

  function togglePlaylists() {
    var panel = document.getElementById('yt-playlists');
    var card = document.querySelector('.hub-card-yt');
    var opening = !panel.classList.contains('open');
    panel.classList.toggle('open');
    document.querySelector('.yt-toggle').classList.toggle('open');
    if (opening) {
      card.classList.add('dropdown-open');
    } else {
      panel.addEventListener('transitionend', function handler() {
        if (!panel.classList.contains('open')) card.classList.remove('dropdown-open');
        panel.removeEventListener('transitionend', handler);
      });
    }
  }
</script>
</body>
</html>
