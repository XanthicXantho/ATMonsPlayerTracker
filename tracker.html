<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATM — Invite Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #101116;
    --surface: #18191f;
    --border: #26272e;
    --accent: #d4a053;
    --link: #7ba4c9;
    --text: #d4d4d8;
    --muted: #6b6d76;
    --pending: #94a3b8;
    --denied: #ef4444;
    --accepted: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(180deg, #0a0c16 0%, #0d0f1a 40%, #111228 100%);
    color: var(--text);
    font-family: 'Outfit', -apple-system, sans-serif;
    font-weight: 400;
    font-size: 16px;
    min-height: 100vh;
    overflow-x: hidden;
  }
  #glitter-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  nav, header, .stats-row-wrap, .table-card, .discord-link, .footer {
    position: relative; z-index: 1;
  }

  nav {
    position: sticky; top: 0; z-index: 10;
    display: flex; justify-content: center; gap: 0;
    padding: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  nav a {
    font-weight: 500;
    font-size: 13px; color: var(--muted);
    text-decoration: none; letter-spacing: 0.5px;
    padding: 14px 20px;
    transition: color 0.15s;
    display: inline-flex; align-items: center; gap: 5px;
  }
  nav a .ext-icon {
    width: 11px; height: 11px;
    fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    opacity: 0.4;
  }
  nav a:hover { color: var(--text); }
  nav a.active { color: var(--accent); }

  header { text-align: center; padding: 48px 20px 32px; }
  .header-title {
    font-weight: 600; font-size: 24px;
    color: var(--text); letter-spacing: -0.3px;
  }
  .header-title span { color: var(--accent); }
  .header-sub {
    margin-top: 8px;
    font-weight: 300; font-size: 15px;
    color: var(--muted);
  }

  .stats-row-wrap {
    display: flex; justify-content: center;
    padding: 0 20px 24px;
  }
  .stats-row {
    display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  }
  .stat-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px; font-weight: 500;
    display: flex; align-items: center; gap: 7px;
    cursor: pointer; user-select: none;
    transition: border-color 0.15s, opacity 0.15s;
    opacity: 0.45;
  }
  .stat-chip:hover { opacity: 0.7; }
  .stat-chip.active { opacity: 1; }
  .stat-chip-pending.active  { border-color: var(--pending); }
  .stat-chip-denied.active   { border-color: var(--denied); }
  .stat-chip-accepted.active { border-color: var(--accepted); }
  .stat-chip .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .dot-pending  { background: var(--pending); }
  .dot-denied   { background: var(--denied); }
  .dot-accepted { background: var(--accepted); }

  .table-card {
    width: 100%; max-width: 640px; margin: 0 auto;
    padding: 0 20px 48px;
  }
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  table { width: 100%; border-collapse: collapse; }
  thead tr { border-bottom: 1px solid var(--border); }
  th {
    font-weight: 600; font-size: 12px;
    color: var(--muted);
    text-align: left; padding: 10px 16px;
    letter-spacing: 0.5px; text-transform: uppercase;
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  tbody.animate tr {
    animation: fadeIn 0.3s ease both;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-6px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  td { padding: 10px 16px; font-size: 15px; }
  td:first-child { color: var(--muted); font-weight: 300; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 10px; border-radius: 4px;
    font-size: 13px; font-weight: 500;
  }
  .badge-pending  { background: rgba(148,163,184,0.08); border: 1px solid rgba(148,163,184,0.2); color: var(--pending); }
  .badge-denied   { background: rgba(239,68,68,0.08);   border: 1px solid rgba(239,68,68,0.2);   color: var(--denied); }
  .badge-accepted { background: rgba(34,197,94,0.08);   border: 1px solid rgba(34,197,94,0.2);   color: var(--accepted); }

  .loading-row td {
    text-align: center; color: var(--muted);
    font-size: 14px; font-weight: 300;
    padding: 32px 16px;
  }
  .loading-dot { animation: blink 1.2s infinite; }
  .loading-dot:nth-child(2) { animation-delay: 0.2s; }
  .loading-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

  .error-row td {
    text-align: center; color: var(--denied);
    font-size: 14px; padding: 24px 16px;
  }

  .discord-link {
    display: block; text-align: center;
    padding: 0 20px;
    color: var(--muted); font-size: 13px;
  }
  .discord-link a { color: var(--link); text-decoration: none; }
  .discord-link a:hover { text-decoration: underline; }

  .footer {
    text-align: center; margin-top: 16px;
    padding: 0 20px 48px;
    color: var(--muted); font-size: 13px; font-weight: 300;
  }

  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  th .sort-arrow { margin-left: 5px; font-size: 12px; display: inline-block; vertical-align: middle; }
  th.sort-asc  .sort-arrow::after { content: '\25B2'; color: var(--accent); }
  th.sort-desc .sort-arrow::after { content: '\25BC'; color: var(--accent); }
  th:not(.sort-asc):not(.sort-desc) .sort-arrow::after { content: '\25B2\25BC'; letter-spacing: -2px; color: var(--muted); }

  @media (max-width: 600px) {
    header { padding: 32px 16px 24px; }
    .header-title { font-size: 20px; }
    .stat-chip { font-size: 12px; padding: 5px 12px; }
    nav a { font-size: 12px; padding: 12px 14px; }
  }
</style>
</head>
<body>

<canvas id="glitter-canvas"></canvas>

<nav>
  <a href="./">Home</a>
  <a href="tracker.html" class="active">Tracker</a>
  <a href="https://www.youtube.com/@Xantho6749" target="_blank" rel="noopener">YouTube<svg class="ext-icon" viewBox="0 0 18 18"><path d="M14 4L7 11"/><path d="M14 9V4H9"/><path d="M4 4H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-1"/></svg></a>
  <a href="https://discord.gg/hMpZFfnqh7" target="_blank" rel="noopener">Discord<svg class="ext-icon" viewBox="0 0 18 18"><path d="M14 4L7 11"/><path d="M14 9V4H9"/><path d="M4 4H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-1"/></svg></a>
</nav>

<header>
  <div class="header-title"><span>Invite Tracker</span></div>
  <div class="header-sub">All The Mons — Hosted by Xantho</div>
</header>

<div class="stats-row-wrap"><div class="stats-row" id="stats-row"></div></div>

<div class="table-card">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:40px">#</th>
          <th class="sortable" id="th-name" onclick="cycleName()">Player <span class="sort-arrow"></span></th>
          <th class="sortable" id="th-status" onclick="cycleStatus()">Status <span class="sort-arrow"></span></th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr class="loading-row">
          <td colspan="3">
            Loading<span class="loading-dot">.</span><span class="loading-dot">.</span><span class="loading-dot">.</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="discord-link">
  Discord &rarr; <a href="https://discord.gg/hMpZFfnqh7" target="_blank">discord.gg/hMpZFfnqh7</a>
</div>

<div class="footer">More invites coming soon</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzbDAYnkHHb0ujLSZ7Kr4cu2dOVJ1_lfmzbRJ0FGlMrM2puYEBcpi6vzfz0T4QgWW8Hgg/exec';

  const canvas = document.getElementById('glitter-canvas');
  const ctx = canvas.getContext('2d');
  const COLORS = ['#f59e0b','#fcd34d','#fbbf24'];
  let flakes = [];

  function resizeCanvas() {
    const oldW = canvas.width || window.innerWidth;
    const oldH = canvas.height || window.innerHeight;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const rx = canvas.width / oldW, ry = canvas.height / oldH;
    for (const f of flakes) { f.x *= rx; f.y *= ry; }
  }
  function spawnFlake() {
    return {
      x: Math.random() * canvas.width, y: -20,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      size: Math.random() * 10 + 8, speed: Math.random() * 0.3 + 0.15,
      drift: (Math.random() - 0.5) * 0.2, rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.01, opacity: Math.random() * 0.3 + 0.15,
    };
  }
  function seedFlakes(n) {
    for (let i = 0; i < n; i++) { const f = spawnFlake(); f.y = Math.random() * canvas.height; flakes.push(f); }
  }
  function animateGlitter() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (Math.random() < 0.03) flakes.push(spawnFlake());
    flakes = flakes.filter(f => f.y < canvas.height + 30);
    for (const f of flakes) {
      f.y += f.speed; f.x += f.drift; f.rot += f.rotSpeed;
      ctx.save(); ctx.globalAlpha = f.opacity;
      ctx.font = `${f.size}px serif`;
      ctx.fillStyle = f.color;
      ctx.translate(f.x, f.y); ctx.rotate(f.rot);
      ctx.fillText('✦', -f.size / 2, f.size / 2);
      ctx.restore();
    }
    requestAnimationFrame(animateGlitter);
  }
  resizeCanvas(); seedFlakes(6); animateGlitter();
  window.addEventListener('resize', resizeCanvas);

  let players = [];
  const statusOrder = { adp: { accepted:0, denied:1, pending:2 }, pda: { pending:0, denied:1, accepted:2 } };
  const badgeMap = {
    pending:  '<span class="badge badge-pending">… Pending</span>',
    denied:   '<span class="badge badge-denied">✗ Denied</span>',
    accepted: '<span class="badge badge-accepted">✓ Accepted</span>',
  };

  let currentSort  = { col: null, dir: null };
  let activeFilters = new Set();

  function toggleFilter(status, shiftHeld) {
    if (shiftHeld) {
      if (activeFilters.has(status)) activeFilters.delete(status);
      else activeFilters.add(status);
    } else {
      if (activeFilters.size === 1 && activeFilters.has(status)) activeFilters.clear();
      else { activeFilters.clear(); activeFilters.add(status); }
    }
    render(true);
  }

  function applySort(col, dir) {
    currentSort = { col, dir };
    document.getElementById('th-name').className   = 'sortable' + (col==='name'   ? (dir==='asc'  ? ' sort-asc' : ' sort-desc') : '');
    document.getElementById('th-status').className = 'sortable' + (col==='status' ? (dir==='adp'  ? ' sort-asc' : ' sort-desc') : '');
    render(true);
  }

  function cycleName()   { if (currentSort.col==='name' && currentSort.dir==='asc') applySort('name','desc'); else applySort('name','asc'); }
  function cycleStatus() { if (currentSort.col==='status' && currentSort.dir==='adp') applySort('status','pda'); else applySort('status','adp'); }

  function getSorted() {
    const showAll = activeFilters.size === 0;
    let arr = players.filter(p => showAll || activeFilters.has(p.status));
    const { col, dir } = currentSort;
    if (!col) {
      const order = statusOrder.adp;
      arr.sort((a,b) => order[a.status] - order[b.status]);
      return arr;
    }
    if (col === 'name') {
      arr.sort((a,b) => dir==='asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));
    } else {
      const order = statusOrder[dir];
      arr.sort((a,b) => order[a.status] - order[b.status]);
    }
    return arr;
  }

  function render(animate) {
    const tbody = document.getElementById('tbody');
    const sorted = getSorted();
    tbody.innerHTML = sorted.map((p, i) => `
      <tr style="animation-delay:${i*0.04}s">
        <td>${String(i+1).padStart(2,'0')}</td>
        <td>${p.name}</td>
        <td>${badgeMap[p.status] || badgeMap.pending}</td>
      </tr>
    `).join('');
    if (animate) tbody.classList.add('animate');
    else tbody.classList.remove('animate');

    const counts = { pending:0, denied:0, accepted:0 };
    players.forEach(p => counts[p.status] !== undefined ? counts[p.status]++ : counts.pending++);
    const showAll = activeFilters.size === 0;
    document.getElementById('stats-row').innerHTML = `
      <div class="stat-chip stat-chip-pending ${showAll || activeFilters.has('pending') ? 'active' : ''}" onclick="toggleFilter('pending', event.shiftKey)">
        <span class="dot dot-pending"></span> ${counts.pending} Pending
      </div>
      <div class="stat-chip stat-chip-denied ${showAll || activeFilters.has('denied') ? 'active' : ''}" onclick="toggleFilter('denied', event.shiftKey)">
        <span class="dot dot-denied"></span> ${counts.denied} Denied
      </div>
      <div class="stat-chip stat-chip-accepted ${showAll || activeFilters.has('accepted') ? 'active' : ''}" onclick="toggleFilter('accepted', event.shiftKey)">
        <span class="dot dot-accepted"></span> ${counts.accepted} Accepted
      </div>
    `;
  }

  let initialLoad = true;
  async function loadPlayers() {
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      players = (Array.isArray(data) ? data : data.players).filter(p => !p.name.includes('__xq9ztestflag__'));
      render(initialLoad);
      initialLoad = false;
    } catch (err) {
      document.getElementById('tbody').innerHTML = `
        <tr class="error-row">
          <td colspan="3">Could not load data <button onclick="loadPlayers()" style="margin-left:12px; font-family:inherit; font-size:13px; color:var(--link); background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:4px 14px; cursor:pointer;">Retry</button></td>
        </tr>`;
    }
  }

  loadPlayers();
  setInterval(loadPlayers, 60000);
</script>
</body>
</html>
